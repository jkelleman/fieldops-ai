<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">FieldOps</title>
  <desc id="d">Edge AI for orchard pest management: trap photo, species count, biofix, degree-days, spray window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f14"/>
      <stop offset="1" stop-color="#15361f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#76b900" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" fill="#76b900"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="130" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1.5">FieldOps</text>
    <text x="72" y="178" font-size="26" fill="#c9e8a1">Edge AI for orchard pest management</text>
    <text x="72" y="214" font-size="18" fill="#9db8a4">Count the insects. Start the biological clock. Tell the grower when to act.</text>

    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="72" y="244" width="150" height="34" rx="17" fill="#76b900" fill-opacity="0.18" stroke="#76b900"/>
      <text x="147" y="266" fill="#e6f5cc">Trap photo</text>
      <text x="236" y="266" fill="#76b900" font-size="18">&#8594;</text>
      <rect x="250" y="244" width="150" height="34" rx="17" fill="#76b900" fill-opacity="0.18" stroke="#76b900"/>
      <text x="325" y="266" fill="#e6f5cc">Species count</text>
      <text x="414" y="266" fill="#76b900" font-size="18">&#8594;</text>
      <rect x="428" y="244" width="130" height="34" rx="17" fill="#76b900" fill-opacity="0.18" stroke="#76b900"/>
      <text x="493" y="266" fill="#e6f5cc">Biofix</text>
      <text x="572" y="266" fill="#76b900" font-size="18">&#8594;</text>
      <rect x="586" y="244" width="150" height="34" rx="17" fill="#76b900" fill-opacity="0.18" stroke="#76b900"/>
      <text x="661" y="266" fill="#e6f5cc">Degree-days</text>
      <text x="750" y="266" fill="#76b900" font-size="18">&#8594;</text>
      <rect x="764" y="244" width="170" height="34" rx="17" fill="#76b900" fill-opacity="0.18" stroke="#76b900"/>
      <text x="849" y="266" fill="#e6f5cc">Spray window</text>
    </g>
  </g>

  <g transform="translate(1010 70)" fill="none" stroke="#76b900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="0" y="0" width="190" height="190" rx="18" stroke-opacity="0.5"/>
    <path d="M30 150 L62 96 L94 120 L126 52 L160 84"/>
    <circle cx="62" cy="96" r="6" fill="#76b900"/>
    <circle cx="94" cy="120" r="6" fill="#76b900"/>
    <circle cx="126" cy="52" r="6" fill="#76b900"/>
    <circle cx="160" cy="84" r="6" fill="#76b900"/>
    <path d="M30 170 H160" stroke-opacity="0.35"/>
  </g>
</svg>
